name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint, generate, vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(git ls-files '*.go' | grep -v '^api/gen/' | xargs gofmt -s -l)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go mod tidy -diff
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: generated code is up to date
        run: scripts/gen.sh && git diff --exit-code -- api/gen api/openapi
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    name: unit, property and fuzz-seed tests (race)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test

  integration:
    name: integration and chaos (PostgreSQL, S3, Prometheus, Toxiproxy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: docker compose -f deploy/compose/test-deps.yaml up -d --wait
      - name: store and integration tests
        run: CFGCANARY_IT=1 go test -race -count=1 -timeout 25m ./internal/store/... ./test/integration/...
      - name: chaos suite
        run: CFGCANARY_IT=1 go test -count=1 -timeout 30m ./test/chaos/...
      - if: failure()
        run: docker compose -f deploy/compose/test-deps.yaml logs --tail 200

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/install-k8s-tools.sh
      - run: make helm-lint

  compose-demo:
    name: Compose demo (image build and end-to-end scenario)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/demo.sh
      - if: always()
        run: docker compose -f deploy/compose/compose.yaml logs --tail 100 server sim
      - if: always()
        run: scripts/demo.sh down
