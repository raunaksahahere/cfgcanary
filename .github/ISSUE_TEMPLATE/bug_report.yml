name: Bug report
description: Something does not behave as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Include cfgcanary version (`cfgcanary version`), the command and its output."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
  - type: input
    id: env
    attributes: {label: Environment, description: "OS, deployment (Compose, Kubernetes, binary), PostgreSQL and S3 versions"}
  - type: markdown
    attributes: {value: "Do not paste credentials, keys or private payloads. Security issues: see SECURITY.md."}
