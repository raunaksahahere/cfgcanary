# Development-only dependencies for the kind example: PostgreSQL and an
# S3-compatible store with credentials from Secrets created by
# scripts/kind-demo.sh. Not for production.
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: cfgcanary}
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - {name: POSTGRES_USER, value: cfgcanary}
            - {name: POSTGRES_DB, value: cfgcanary}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-password, key: password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, cfgcanary]}
            periodSeconds: 2
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: cfgcanary}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: cfgcanary}
spec:
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          args: [server, /data, --address, ":9000"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: cfgcanary-s3, key: access-key}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: cfgcanary-s3, key: secret-key}}
          ports: [{containerPort: 9000}]
          readinessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            periodSeconds: 2
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: cfgcanary}
spec: {selector: {app: minio}, ports: [{port: 9000}]}
