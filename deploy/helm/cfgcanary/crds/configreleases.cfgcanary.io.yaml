# ConfigRelease: intent to deliver a payload to a cfgcanary config.
# Helm installs CRDs from crds/ on first install only; upgrade them with
# kubectl apply -f when the chart's CRD changes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: configreleases.cfgcanary.io
spec:
  group: cfgcanary.io
  scope: Namespaced
  names:
    kind: ConfigRelease
    listKind: ConfigReleaseList
    plural: configreleases
    singular: configrelease
    shortNames: [cfgrel]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Config, type: string, jsonPath: .spec.config}
        - {name: Version, type: integer, jsonPath: .status.version}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Ring, type: integer, jsonPath: .status.activeRing}
        - {name: Release, type: string, jsonPath: .status.releaseId, priority: 1}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [config]
              properties:
                config: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$', description: Registered cfgcanary config name.}
                environment: {type: string, default: prod}
                payload: {type: string, maxLength: 1000000, description: Payload text. Mutually exclusive with payloadFrom.}
                payloadFrom:
                  type: object
                  properties:
                    configMapKeyRef:
                      type: object
                      required: [name, key]
                      properties:
                        name: {type: string}
                        key: {type: string}
                description: {type: string, maxLength: 500}
                paused: {type: boolean, description: Pause or resume the release this resource created.}
                projectRings: {type: boolean, default: true, description: Write <config>-<environment>-ring-<n> ConfigMaps in this namespace.}
              x-kubernetes-validations:
                - rule: "has(self.payload) != has(self.payloadFrom)"
                  message: exactly one of payload and payloadFrom is required
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
