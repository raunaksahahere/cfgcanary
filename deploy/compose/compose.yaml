# cfgcanary local demonstration stack.
#
#   docker compose -f deploy/compose/compose.yaml up -d --build --wait
#   docker compose -f deploy/compose/compose.yaml run --rm cli demo
#
# Everything is authenticated: agents and operators use mTLS client
# certificates, artifacts are ed25519-signed, and credentials are generated by
# the one-shot `bootstrap` service into the `devstate` volume (never into the
# repository). Host ports bind to 127.0.0.1 only.
name: cfgcanary

x-cfgcanary: &cfgcanary
  image: cfgcanary:dev
  build:
    context: ../..
    args:
      VERSION: 0.1.0
  volumes:
    - devstate:/dev-state:ro
  environment: &cfgenv
    CFGCANARY_PKI_DIR: /dev-state/pki
    CFGCANARY_SERVER: server:8443
    CFGCANARY_SERVER_NAME: cfgcanary-server
    CFGCANARY_TRUST_BUNDLE: /dev-state/pki/trust.json

services:
  bootstrap:
    <<: *cfgcanary
    command: ["dev", "bootstrap", "--dir", "/dev-state", "--shared"]
    # One-shot: the new volume is root-owned, so this step runs as root and
    # leaves files readable by the non-root services. Nothing long-running
    # runs as root.
    user: "0:0"
    volumes:
      - devstate:/dev-state
    restart: "no"

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: cfgcanary
      POSTGRES_DB: cfgcanary
      POSTGRES_PASSWORD_FILE: /dev-state/secrets/postgres-password
    volumes:
      - devstate:/dev-state:ro
      - pgdata:/var/lib/postgresql
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfgcanary -d cfgcanary"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER_FILE: /dev-state/secrets/s3-access-key
      MINIO_ROOT_PASSWORD_FILE: /dev-state/secrets/s3-secret-key
    volumes:
      - devstate:/dev-state:ro
      - s3data:/data
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || wget -qO- http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    <<: *cfgcanary
    command: ["server"]
    environment:
      <<: *cfgenv
      CFGCANARY_LISTEN: ":8443"
      CFGCANARY_REST_LISTEN: ":8444"
      CFGCANARY_METRICS_LISTEN: ":9464"
      CFGCANARY_DB_URL_FILE: /dev-state/secrets/db-url
      CFGCANARY_S3_ENDPOINT: s3:9000
      CFGCANARY_S3_BUCKET: cfgcanary
      CFGCANARY_S3_ACCESS_KEY_FILE: /dev-state/secrets/s3-access-key
      CFGCANARY_S3_SECRET_KEY_FILE: /dev-state/secrets/s3-secret-key
      CFGCANARY_TLS_CERT: /dev-state/pki/server.pem
      CFGCANARY_TLS_KEY: /dev-state/pki/server-key.pem
      CFGCANARY_TLS_CA: /dev-state/pki/ca.pem
      CFGCANARY_ARTIFACT_KEY: /dev-state/pki/artifact.key
      CFGCANARY_DELIVERY_KEY: /dev-state/pki/delivery.key
      CFGCANARY_RBAC: /dev-state/pki/rbac.yaml
      CFGCANARY_PROMETHEUS_URL: http://prometheus:9090
      CFGCANARY_MEMBERSHIP_WINDOW: 60s
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/local/bin/cfgcanary", "doctor-probe", "http://127.0.0.1:9464/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Optional fault proxy between the simulated agents and the control plane.
  # Cut or degrade the link with:
  #   docker compose -f deploy/compose/compose.yaml exec toxiproxy /toxiproxy-cli toggle agents
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host", "0.0.0.0", "-config", "/etc/toxiproxy/proxies.json"]
    volumes:
      - ./toxiproxy/proxies.json:/etc/toxiproxy/proxies.json:ro

  # 50 real agents and SDK clients plus a synthetic sample application.
  sim:
    <<: *cfgcanary
    command: ["sim", "--agents", "50", "--rps", "40", "--root", "/tmp/sim", "--metrics-listen", ":9465",
              "--allowed-origins", "http://s3:9000", "--reconcile-interval", "15s"]
    environment:
      <<: *cfgenv
      CFGCANARY_SERVER: toxiproxy:18443
    tmpfs:
      - /tmp/sim:uid=65532,gid=65532
    depends_on:
      server: {condition: service_healthy}
      toxiproxy: {condition: service_started}
    healthcheck:
      test: ["CMD", "/usr/local/bin/cfgcanary", "doctor-probe", "http://127.0.0.1:9465/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /dev-state/secrets/grafana-admin-password
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cfgcanary.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - devstate:/dev-state:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Operator CLI inside the network:
  #   docker compose -f deploy/compose/compose.yaml run --rm cli releases list
  cli:
    <<: *cfgcanary
    profiles: ["tools"]
    working_dir: /usr/share/cfgcanary
    depends_on:
      server: {condition: service_healthy}

  # Optional trace viewer: COMPOSE_PROFILES=tracing and
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317 before `up`.
  jaeger:
    image: jaegertracing/jaeger:2.12.0
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  devstate:
  pgdata:
  s3data:
