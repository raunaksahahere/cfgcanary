# Services used by `make test-integration`, `make chaos` and `make bench`.
# Development-only credentials; every port binds to 127.0.0.1.
name: cfgcanary-test
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: cfgcanary
      POSTGRES_PASSWORD: cfgcanary-test
      POSTGRES_DB: cfgcanary
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql:size=1g"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfgcanary -d cfgcanary"]
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: cfgcanary
      MINIO_ROOT_PASSWORD: cfgcanary-test-secret
    ports: ["127.0.0.1:59000:9000"]
    tmpfs: ["/data:size=512m"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || wget -qO- http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes: ["./testdeps/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:59090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    ports:
      - "127.0.0.1:58474:8474"
      # proxied listeners created by tests
      - "127.0.0.1:56000-56009:56000-56009"
    extra_hosts: ["host.docker.internal:host-gateway"]
